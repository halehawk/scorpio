---
#
# ========== ADIOS2 HDF5 engine + HDF5 subfiling example ============
# Builds examples/adios2_hdf5subfile (a standalone ADIOS2 program, not SCORPIO)
# against conda-forge MPICH + parallel HDF5 + ADIOS2, runs it on 4 ranks,
# and reads the result back with bpls through the ADIOS2 HDF5 engine.
#
name: ADIOS2 HDF5 subfiling example

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - 'halehawk/**'
    paths:
      - 'examples/adios2_hdf5subfile/**'
      - '.github/workflows/adios2_hdf5_subfile_workflow.yaml'

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    env:
      # Some runners have an Azure MANA adapter that UCX fails to initialize,
      # which makes MPI_Init abort; restrict UCX to shared memory and TCP.
      UCX_TLS: self,sm,tcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          channels: conda-forge,defaults
          auto-activate-base: false

      - name: Install dependencies (MPI, parallel HDF5, ADIOS2)
        shell: bash -l {0}
        run: |
          conda create -n h5sub_env
          conda activate h5sub_env
          conda install -y \
            conda-forge::cmake \
            conda-forge::cxx-compiler \
            conda-forge::mpich \
            conda-forge::mpich-mpicxx \
            "conda-forge::hdf5=*=mpi_mpich_*" \
            "conda-forge::adios2=*=mpi_mpich_*"

      - name: Show HDF5 and ADIOS2 configuration
        shell: bash -l {0}
        run: |
          conda activate h5sub_env
          conda list "hdf5|adios2|mpich"
          echo "=== HDF5 subfiling VFD ==="
          grep -n "H5_HAVE_SUBFILING_VFD\|H5_HAVE_PARALLEL\b" "${CONDA_PREFIX}/include/H5pubconf.h" || echo "not found"
          echo "=== ADIOS2 engines ==="
          bpls -V || true
          grep -rn "ADIOS2_HAVE_HDF5" "${CONDA_PREFIX}/lib/cmake/adios2/" | head -5 || true

      - name: Build
        shell: bash -l {0}
        run: |
          conda activate h5sub_env
          CXX=mpicxx cmake -S examples/adios2_hdf5subfile -B build \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX}"
          cmake --build build

      - name: Run on 4 ranks
        shell: bash -l {0}
        run: |
          set -e
          conda activate h5sub_env
          cd build
          mpiexec -n 4 ./adios2_hdf5subfile
          echo "=== Files written ==="
          ls -la

      - name: Read the output back with the ADIOS2 HDF5 engine
        shell: bash -l {0}
        run: |
          set -e
          conda activate h5sub_env
          cd build
          bpls -E HDF5 -la simulation_output.h5
          bpls -E HDF5 -d temperature simulation_output.h5 | tail -n 20
